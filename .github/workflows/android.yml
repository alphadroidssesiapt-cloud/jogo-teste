name: Gerar APK Aventura Cerrado

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar arquivos do jogo
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Preparar arquivos offline
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp -r assets www/assets
          ls -lah www

      - name: Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7
          npm install @capacitor/cli@7
          npm install @capacitor/android@7

      - name: Criar aplicativo Android
        run: |
          npx cap init "Aventura Cerrado" "br.com.aventuracerrado" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Configurar Android
        run: |
          python3 <<'PY'
          import xml.etree.ElementTree as ET

          path = "android/app/src/main/AndroidManifest.xml"
          ns = "http://schemas.android.com/apk/res/android"

          ET.register_namespace("android", ns)

          tree = ET.parse(path)
          root = tree.getroot()

          for activity in root.findall("./application/activity"):
              activity.set("{" + ns + "}screenOrientation", "landscape")

          for permission in root.findall("uses-permission"):
              if permission.get("{" + ns + "}name") == "android.permission.INTERNET":
                  root.remove(permission)

          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY

      - name: Configurar tela cheia
        run: |
          cat > android/app/src/main/java/br/com/aventuracerrado/MainActivity.java <<'JAVA'
          package br.com.aventuracerrado;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(
                      WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON
                  );

                  fullscreen();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);

                  if (hasFocus) {
                      fullscreen();
                  }
              }

              private void fullscreen() {
                  getWindow().getDecorView().setSystemUiVisibility(
                      View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                  );
              }
          }
          JAVA

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK final
        run: |
          mkdir -p resultado
          cp android/app/build/outputs/apk/debug/app-debug.apk resultado/Aventura-Cerrado.apk
          ls -lh resultado

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Aventura-Cerrado-APK
          path: resultado/Aventura-Cerrado.apk
          retention-days: 30
          if-no-files-found: error
