<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ALERTA FAUNA: Aventura pelo Cerrado</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    body {
      background: #0d1612;
      color: #f4f7f2;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-shell {
      position: relative;
      width: min(96vw, 960px);
      aspect-ratio: 16 / 9;
      border: 4px solid #2e5a44;
      box-shadow: 0 18px 50px rgba(0,0,0,0.75);
      background: #1a2e24;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 20, 16, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      z-index: 10;
    }
    .hidden { display: none !important; }
    h1 {
      font-size: clamp(18px, 3.2vw, 32px);
      color: #ffcf40;
      text-shadow: 3px 3px 0 #1b3b2b;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }
    h2 {
      font-size: clamp(11px, 1.6vw, 16px);
      color: #7ee0b8;
      margin-bottom: 10px;
    }
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 180px));
      gap: 8px;
      margin-top: 6px;
    }
    button {
      background: #238b68;
      color: #fff;
      border: 3px solid #9ff5d2;
      padding: 8px 12px;
      font-family: inherit;
      font-weight: bold;
      font-size: clamp(11px, 1.3vw, 13px);
      cursor: pointer;
      text-transform: uppercase;
      box-shadow: 0 3px 0 #0f4734;
      transition: all 0.1s;
    }
    button:hover { background: #2ca87e; transform: translateY(-1px); }
    button:active { transform: translateY(2px); box-shadow: none; }
    button.secondary { background: #284639; border-color: #6ea88f; }
    button:disabled { background: #1b2e25; border-color: #3b5c4c; color: #5c8573; cursor: not-allowed; box-shadow: none; transform: none; }
    .mode-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .mode-btn.active { background: #e09f1f; border-color: #fff3b0; color: #1b1400; }
    .diff-row { display: flex; gap: 6px; margin-bottom: 6px; }
    .diff-btn.active { background: #e09f1f; border-color: #fff3b0; color: #1b1400; }
    .panel-box {
      background: #12221b;
      border: 3px solid #3a7a5e;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
      padding: 14px;
      max-width: 680px;
      width: 92%;
      max-height: 65%;
      overflow-y: auto;
      font-size: 12.5px;
      line-height: 1.45;
      text-align: left;
      margin-bottom: 10px;
    }
    .level-card {
      background: #183327;
      border: 2px solid #52b788;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      cursor: pointer;
      border-radius: 2px;
    }
    .level-card:hover:not(.locked) { background: #224a38; border-color: #9ff5d2; }
    .level-card.locked { opacity: 0.6; cursor: not-allowed; border-color: #2b4a3c; }
    .controls-bar {
      margin-top: 8px;
      font-size: 12px;
      color: #9ec4b3;
      text-align: center;
    }

    #touch-controls {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
      z-index: 5;
    }
    #touch-controls.active { display: block; }
    .t-btn {
      position: absolute;
      background: rgba(35, 139, 104, 0.45);
      border: 2px solid rgba(159, 245, 210, 0.7);
      color: #fff;
      font-family: inherit;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      pointer-events: auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .t-btn:active { background: rgba(44, 168, 126, 0.75); }
    #btn-left { left: 16px; bottom: 16px; width: 56px; height: 56px; }
    #btn-right { left: 82px; bottom: 16px; width: 56px; height: 56px; }
    #btn-down { left: 148px; bottom: 16px; width: 56px; height: 56px; }
    #btn-jump { right: 16px; bottom: 16px; width: 64px; height: 64px; border-radius: 50%; background: rgba(224, 159, 31, 0.55); border-color: #ffe66d; }
    #btn-attack { right: 92px; bottom: 24px; width: 52px; height: 52px; border-radius: 50%; background: rgba(230, 80, 80, 0.55); border-color: #ff9999; }
    #btn-pause-mob { top: 12px; right: 12px; width: 40px; height: 32px; font-size: 12px; pointer-events: auto; }
  </style>
</head>
<body>
  <div id="game-shell">
    <canvas id="gameCanvas" width="480" height="270"></canvas>

    <div id="touch-controls">
      <div id="btn-left" class="t-btn">◀</div>
      <div id="btn-right" class="t-btn">▶</div>
      <div id="btn-down" class="t-btn">▼</div>
      <div id="btn-jump" class="t-btn">PULA</div>
      <div id="btn-attack" class="t-btn">CHUTE</div>
      <div id="btn-pause-mob" class="t-btn">⏸</div>
    </div>

    <div id="menu-main" class="overlay">
      <h1>ALERTA FAUNA</h1>
      <h2>AVENTURA PELO CERRADO</h2>
      <div style="margin-bottom:4px; font-size:11px; color:#7ee0b8;">MODO DE JOGO:</div>
      <div class="mode-row">
        <button class="mode-btn active" data-mode="pc">💻 PC (TECLADO)</button>
        <button class="mode-btn" data-mode="celular">📱 CELULAR (TELA)</button>
      </div>
      <div class="diff-row">
        <button class="diff-btn" data-diff="facil">FÁCIL</button>
        <button class="diff-btn active" data-diff="normal">NORMAL</button>
        <button class="diff-btn" data-diff="dificil">DIFÍCIL</button>
      </div>
      <div class="menu-grid">
        <button id="btn-play">▶ JOGAR</button>
        <button id="btn-levels" class="secondary">FASES</button>
        <button id="btn-howto" class="secondary">COMO JOGAR</button>
        <button id="btn-missions" class="secondary">MISSÕES</button>
        <button id="btn-records" class="secondary">RECORDES</button>
        <button id="btn-achievements" class="secondary">CONQUISTAS</button>
      </div>
    </div>

    <div id="menu-sub" class="overlay hidden">
      <h2 id="sub-title">TÍTULO</h2>
      <div id="sub-content" class="panel-box"></div>
      <button id="btn-sub-back">VOLTAR</button>
    </div>

    <div id="menu-pause" class="overlay hidden">
      <h1>PAUSADO</h1>
      <div class="menu-grid">
        <button id="btn-resume">CONTINUAR</button>
        <button id="btn-restart" class="secondary">REINICIAR</button>
        <button id="btn-quit" class="secondary">MENU</button>
      </div>
    </div>

    <div id="menu-end" class="overlay hidden">
      <h1 id="end-title">FASE CONCLUÍDA</h1>
      <div id="end-content" class="panel-box"></div>
      <div class="menu-grid">
        <button id="btn-next">AVANÇAR</button>
        <button id="btn-end-menu" class="secondary">MENU</button>
      </div>
    </div>
  </div>
  <div id="info-controls" class="controls-bar">
    [A/D] Mover &nbsp;|&nbsp; [W / ESPAÇO / BACKSPACE] Pular &amp; Pulo Duplo &nbsp;|&nbsp; [S] Agachar &nbsp;|&nbsp; [J / Z] Chute &nbsp;|&nbsp; [P] Pausar
  </div>

  function createFallbackCanvas(w, h, drawFn) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    drawFn(g, w, h);
    return c;
  }

  function processChromaKey(img, type) {
    const c = document.createElement('canvas');
    c.width = img.width;
    c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    const id = g.getImageData(0, 0, c.width, c.height);
    const d = id.data;

    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], gr = d[i + 1], b = d[i + 2];
      if (type === 'wolf_walk') {
        if (Math.min(r,gr,b)>180 && Math.max(r,gr,b)-Math.min(r,gr,b)<22) d[i+3]=0;
      } else if (type === 'lobo') {
        if (type === 'seed' && r > 242 && gr > 242 && b > 242) d[i + 3] = 0;
      } else if (type === 'seed') {
        if (r > 242 && gr > 242 && b > 242) d[i + 3] = 0;
      } else if (type === 'npc') {
        if (r > 155 && b > 120 && gr < 115 && (r - gr) > 55) d[i + 3] = 0;
      } else if (type === 'cerrado') {
        const py = Math.floor((i / 4) / c.width);
        if (py > c.height * 0.34 && py < c.height * 0.77) {
          if (r > 155 && r < 205 && gr > 175 && gr < 220 && b > 215) {
            d[i + 3] = 0;
          }
        }
      }
    }
    g.putImageData(id, 0, 0);
    return c;
  }

  function loadAllAssets() {
    const entries = Object.entries(rawSources);
    return Promise.all(entries.map(([key, src]) => new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        sheets[key] = processChromaKey(img, key);
        resolve();
      };
      img.onerror = () => {
        if (key === 'lobo') {
          sheets.lobo = createFallbackCanvas(64, 64, (g) => {
            g.fillStyle = '#40e0d0'; g.fillRect(16, 16, 32, 32);
          });
        } else if (key.startsWith('landscape') || key.startsWith('wolf_') || key === 'bird' || key === 'roller') {
          sheets[key] = null;
        } else if (key === 'seed') {
          sheets.seed = createFallbackCanvas(32, 32, (g) => {
            g.fillStyle = '#52b788'; g.beginPath(); g.arc(16, 16, 10, 0, Math.PI*2); g.fill();
          });
        } else if (key === 'npc') {
          sheets.npc = createFallbackCanvas(64, 64, (g) => {
            g.fillStyle = '#1d3557'; g.fillRect(16, 16, 32, 48);
          });
        } else {
          sheets.cerrado = createFallbackCanvas(100, 100, (g) => {
            g.fillStyle = '#2d6a4f'; g.fillRect(0,0,100,100);
          });
        }
        resolve();
      };
      img.src = src;
    })));
  }

      ctx.drawImage(sheet, sx, sy, sw, sh, Math.round(dx), Math.round(dy), Math.round(dw), Math.round(dh));

    if (tintOrange) {

  function drawObstacle(sheet, rect, x,y,w,h,flip=false) {
    if (!sheet || !rect) return;
    const key = (sheet===sheets.roller?'roller':'cerrado')+rect.join(',');
    let sprite=obstacleCache.get(key);
    if (!sprite) {
      const [a,b,c,d]=rect;
      sprite=document.createElement('canvas');
      sprite.width=Math.max(1,Math.round(c*sheet.width));
      sprite.height=Math.max(1,Math.round(d*sheet.height));
      const g=sprite.getContext('2d');
      g.drawImage(sheet,a*sheet.width,b*sheet.height,c*sheet.width,d*sheet.height,0,0,sprite.width,sprite.height);
      g.globalCompositeOperation='source-atop';
      g.fillStyle='rgba(255,155,45,0.34)';
      g.fillRect(0,0,sprite.width,sprite.height);
      obstacleCache.set(key,sprite);
    }
    ctx.save();

  const AudioFX = (() => {
    let actx = null;

    function ensure() {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    }
    function tone(freq, dur, type = 'square', gainVal = 0.06, slide = 0) {
      try {
        ensure();
        const o = actx.createOscillator();
        const g = actx.createGain();
        o.type = type;
        o.frequency.setValueAtTime(freq, actx.currentTime);
        if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), actx.currentTime + dur);
        g.gain.setValueAtTime(gainVal, actx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(); o.stop(actx.currentTime + dur);
      } catch (_) {}
    }
    return {
      jump: () => tone(260, 0.14, 'square', 0.06, 260),
      djump: () => tone(380, 0.16, 'square', 0.06, 320),
      kick: () => tone(180, 0.11, 'sawtooth', 0.07, -110),
      seed: () => { tone(660, 0.07, 'square', 0.06); setTimeout(() => tone(990, 0.11, 'square', 0.06), 60); },

      block: () => tone(310, 0.09, 'square', 0.06, 120),
      hit: () => tone(130, 0.25, 'sawtooth', 0.08, -80),
      win: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'square', 0.06), i * 110)),
      startBGM() {
        ensure();

        const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63];
        let idx = 0;
        bgmInterval = setInterval(() => {
          if (Math.random() < 0.7) {
            tone(notes[idx % notes.length], 0.25, 'triangle', 0.03);
          }
          idx++;
        }, 320);
      },
      stopBGM() {
        if (bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
      }
    };
  })();

  function tryJump() {

  function spawnParticles(x, y, color, count = 8) {

  function buildLevel(idx) {
    const cfg = LEVELS[idx];
    const mult = DIFF_MULT[difficulty];
    const platforms = [];
    const blocks = [];
    const seeds = [];
    const obstacles = [];
    const decors = [];

    const pits = [];
    for (let x = 520; x < cfg.length - 420; x += Math.round(480 / mult)) {
      if (Math.round((x - 520) / Math.round(480 / mult)) % 2 === 0) pits.push({ x, w: 54 });
    }

    for (let x = 260; x < cfg.length - 360; x += 270) {
      const py = (x % 540 === 0) ? 140 : 162;
      platforms.push({ x, y: py, w: 70, h: 16 });
      blocks.push({ x: x + 26, y: py - 46, w: 18, h: 18, hit: false, bounce: 0 });
      seeds.push({ x: x + 10, y: py - 20, collected: false, bob: x * 0.02 });
      seeds.push({ x: x + 44, y: py - 20, collected: false, bob: x * 0.02 + 1 });
    }

    for (let x = 180; x < cfg.length - 300; x += 190) {
      const inPit = pits.some(p => x > p.x - 20 && x < p.x + p.w + 20);
      if (!inPit) {
        seeds.push({ x, y: GROUND_Y - 24, collected: false, bob: x * 0.05 });
      }
    }

    const obsTypes = ['rock', 'bush', 'cactus', 'branch_high', 'rolling_cone', 'bird_fly'];
    for (let x = 340; x < cfg.length - 340; x += Math.round(230 / mult)) {
      const inPit = pits.some(p => x > p.x - 50 && x < p.x + p.w + 50);
      if (inPit) continue;
      const t = obsTypes[(Math.floor(x / 90) + idx) % obsTypes.length];
      if (t === 'bird_fly') {
        obstacles.push({
          type: 'bird', x, y: GROUND_Y - 54, w: 26, h: 20,
          vx: -65 * mult, baseX: x, baseY: GROUND_Y - 54, anim: 0, defeated: false
        });
        seeds.push({ x: x + 6, y: GROUND_Y - 94, collected: false, bob: 0 });
      } else if (t === 'branch_high') {
        obstacles.push({ type: 'bird', x, y: GROUND_Y - 54, w: 26, h: 20, vx: -65 * mult, baseX: x, baseY: GROUND_Y - 54, anim: 0, defeated: false });
        seeds.push({ x: x + 13, y: GROUND_Y - 18, collected: false, bob: 0 });
      } else if (t === 'rolling_cone') {
        const h = 26;
        obstacles.push({
          type: 'roller', x, y: GROUND_Y - h, w: 26, h: h,
          vx: -52 * mult, baseX: x, anim: 0, defeated: false
        });
      } else if (t === 'cactus') {
        const h = 38;
        obstacles.push({ type: t, x, y: GROUND_Y - h, w: 20, h: h, defeated: false });
      } else {
        const h = t === 'rock' ? 28 : 24;
        obstacles.push({ type: t, x, y: GROUND_Y - h, w: 30, h: h, defeated: false });
      }
    }

    for (let x = 90; x < cfg.length - 200; x += 175) {
      const fl = cfg.flora[Math.floor(x / 175) % cfg.flora.length];
      const fh = fl === 'bush' ? 22 : 54;
      decors.push({ sprite: fl, x, y: GROUND_Y - fh, w: fl === 'bush' ? 28 : 46, h: fh });
      if (Math.floor(x / 175) % 2 === 1) {
        const fa = cfg.fauna[Math.floor(x / 350) % cfg.fauna.length];
        decors.push({ sprite: fa, x: x + 58, y: GROUND_Y - 22, w: 28, h: 22 });
      }
    }

    return {
      cfg, pits, platforms, blocks, seeds, obstacles, decors,
      npcX: cfg.length - 130,
      collectedInLevel: 0,
      deliverTimer: 0
    };
  }

  function startRun(levelIdx = 0) {

  function startLevel(idx) {
    currentLevelIdx = idx;

    levelHits = 0;

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function update(dt) {
    if (state !== 'PLAY' && state !== 'DELIVER') return;

    if (state === 'PLAY') {
      elapsedMs += dt * 1000;
    }

    if (state === 'DELIVER') {
      document.getElementById('touch-controls').classList.remove('active');
      levelData.deliverTimer += dt;
      if (levelData.deliverTimer > 2.2) {
        finishLevelDialog();
      }
      updateParticles(dt);
      return;
    }

    const mult = DIFF_MULT[difficulty];
    const moveSpeed = 160 * mult;

    const left = keys['a'] || keys['arrowleft'] || touchState.left;
    const right = keys['d'] || keys['arrowright'] || touchState.right;
    const down = keys['s'] || keys['arrowdown'] || touchState.down;

    if (down && player.onGround) {
      if (!player.crouching) {
        player.crouching = true;
        player.y += 16;
        player.h = 28;
      }
    } else if (player.crouching) {
      player.crouching = false;
      player.y -= 16;
      player.h = 44;
      player.standTimer = 0.16;
    }

    const speedFactor = player.crouching ? 0.45 : 1;
    if (left) {
      player.vx = -moveSpeed * speedFactor;
      player.facing = -1;
    } else if (right) {
      player.vx = moveSpeed * speedFactor;
      player.facing = 1;
    } else {
      player.vx *= 0.72;
      if (Math.abs(player.vx) < 4) player.vx = 0;
    }

    if (player.attackTimer > 0) player.attackTimer -= dt;
    if (player.invulnTimer > 0) player.invulnTimer -= dt;
    if (player.standTimer > 0) player.standTimer -= dt;
    const pose = player.attackTimer > 0 ? 'attack' : !player.onGround ? 'jump' : player.crouching ? 'crouch' : Math.abs(player.vx) > 110 ? 'run' : Math.abs(player.vx) > 8 ? 'walk' : 'idle';
    if (player.pose !== pose) { player.pose = pose; player.animTimer = 0; }
    else player.animTimer += dt;

    player.x += player.vx * dt;
    if (player.x < 10) player.x = 10;

    const prevBottom = player.y + player.h;
    const prevTop = player.y;
    player.vy += 860 * dt;
    player.y += player.vy * dt;
    player.onGround = false;

    const centerFoot = player.x + player.w * 0.5;
    const overPit = levelData.pits.some(p => centerFoot > p.x + 3 && centerFoot < p.x + p.w - 3);

    if (!overPit && player.vy >= 0 && prevBottom <= GROUND_Y + 4 && player.y + player.h >= GROUND_Y) {
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
      player.jumpsLeft = 2;
    }

    for (const plat of levelData.platforms) {
      if (player.vy >= 0 && prevBottom <= plat.y + 4 && player.y + player.h >= plat.y &&
          player.x + player.w > plat.x + 2 && player.x < plat.x + plat.w - 2) {
        player.y = plat.y - player.h;
        player.vy = 0;
        player.onGround = true;
        player.jumpsLeft = 2;
      }
    }

    for (const blk of levelData.blocks) {
      if (blk.bounce > 0) blk.bounce = Math.max(0, blk.bounce - dt * 24);
      if (player.vy < 0 && prevTop >= blk.y + blk.h - 4 && player.y <= blk.y + blk.h &&
          player.x + player.w > blk.x + 2 && player.x < blk.x + blk.w - 2) {
        player.y = blk.y + blk.h;
        player.vy = 40;
        blk.bounce = 5;
        AudioFX.block();
        if (!blk.hit) {
          blk.hit = true;
          levelData.seeds.push({ x: blk.x + 2, y: blk.y - 20, collected: false, bob: 0 });
          spawnParticles(blk.x + 9, blk.y, '#ffcf40', 8);
        }
      }
    }

    if (player.y > canvas.height + 20) {
      damagePlayer(true);
    }

    for (const s of levelData.seeds) {
      if (s.collected) continue;
      s.bob += dt * 5;
      if (rectsOverlap(player, { x: s.x, y: s.y, w: 16, h: 18 })) {
        s.collected = true;
        levelData.collectedInLevel++;
        totalRunSeeds++;
        score += 100;
        AudioFX.seed();
        spawnParticles(s.x + 8, s.y + 9, '#a7f3d0', 10);

        const save = Storage.get();
        save.totalSeeds = (save.totalSeeds || 0) + 1;
        Storage.save(save);
        Storage.unlockAch('first_seed');
        if (save.totalSeeds >= 50) Storage.unlockAch('protector_50');
      }
    }

    const kickBox = player.attackTimer > 0 ? {
      x: player.facing === 1 ? player.x + player.w : player.x - 26,
      y: player.y + 4, w: 26, h: 28
    } : null;

    for (const obs of levelData.obstacles) {
      if (obs.defeated) continue;
      if (obs.type === 'roller' || obs.type === 'bird') {
        obs.x += obs.vx * dt;
        if (obs.x < obs.baseX - 95) { obs.x = obs.baseX - 95; obs.vx = Math.abs(obs.vx); }
        if (obs.x > obs.baseX + 95) { obs.x = obs.baseX + 95; obs.vx = -Math.abs(obs.vx); }
        obs.anim = (obs.anim || 0) + dt;
        if (obs.type === 'bird') { obs.y = obs.baseY + Math.sin(obs.anim * 3) * 4; }
      }

      if (kickBox && obs.type === 'roller' && rectsOverlap(kickBox, obs)) {
        obs.defeated = true;
        score += 150;
        AudioFX.stomp();
        spawnParticles(obs.x + 13, obs.y + 10, '#ffcf40', 10);
        continue;
      }

      if (obs.type === 'bird' && !obs.passed && player.x > obs.baseX + 125) {
        obs.passed = true; if (!obs.collided) score += 150;
      }
      if (rectsOverlap(player, obs)) {
        obs.collided = true;
        if (obs.type === 'roller' && player.vy > 0 && prevBottom <= obs.y + 10) {
          obs.defeated = true;
          player.vy = -260;
          score += 150;
          AudioFX.stomp();
          spawnParticles(obs.x + 13, obs.y + 10, '#ffcf40', 10);
        } else {
          damagePlayer(false);
        }
      }
    }

    const targetCam = player.x - 130;
    cameraX += (Math.max(0, Math.min(levelData.cfg.length - canvas.width, targetCam))-cameraX)*Math.min(1,dt*10);

    if (player.x + player.w >= levelData.npcX - 10) {
      player.vx = 0;
      player.crouching = false;
      player.h = 44;
      player.y = GROUND_Y - 44;
      state = 'DELIVER';
      levelData.deliverTimer = 0;
      AudioFX.win();
      spawnParticles(levelData.npcX + 12, GROUND_Y - 40, '#ffcf40', 22);
    }

    updateParticles(dt);
  }

  function damagePlayer(fellInPit) {
    if (player.invulnTimer > 0 && !fellInPit) return;
    lives--;
    levelHits++;
    AudioFX.hit();
    spawnParticles(player.x + 11, player.y + 22, '#ff6b6b', 14);

    if (lives <= 0) {
      endGame(false);
      return;
    }

    if (fellInPit) {
      player.x = Math.max(40, player.x - 90);
      player.y = GROUND_Y - 70;
      player.vy = 0;
    }
    player.invulnTimer = 1.5;
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 320 * dt;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function formatTime(ms) {
    const mins = Math.floor(ms / 60000);
    const secs = Math.floor((ms % 60000) / 1000);
    const mils = Math.floor(ms % 1000);
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}:${String(mils).padStart(3, '0')}`;
  }

  const bgCache = {};
  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const lvl = levelData || buildLevel(0);
    const bgNorm = CERRADO_SPRITES[lvl.cfg.bgKey];

    const landscape = sheets['landscape' + lvl.cfg.id];
    const bgW = landscape ? Math.max(canvas.width, Math.round(GROUND_Y * landscape.width / landscape.height)) : canvas.width;
    const parallaxOffset = Math.floor((cameraX * 0.25) % bgW);
    if (!bgCache[lvl.cfg.bgKey] && (landscape || sheets.cerrado)) {
      bgCache[lvl.cfg.bgKey] = createFallbackCanvas(bgW, GROUND_Y, (g,w,h) => {
        g.filter = 'blur(2px)';
        if (landscape) g.drawImage(landscape,-4,-4,w+8,h+8);
        else {
          const [x,y,r,t] = bgNorm;
          g.drawImage(sheets.cerrado,x*sheets.cerrado.width,y*sheets.cerrado.height,r*sheets.cerrado.width,t*sheets.cerrado.height,-12,-12,w+24,h+24);
        }
      });
    }
    const bg = bgCache[lvl.cfg.bgKey];
    if(bg){ctx.drawImage(bg,-parallaxOffset,0);ctx.drawImage(bg,bgW-parallaxOffset,0);}
    ctx.save(); ctx.globalAlpha=.55; ctx.filter = 'blur(1px)';
    for(let i=0;i<7;i++){
      const x=((i*91-cameraX*.48)%560+560)%560-40;
      drawSheetRegion(sheets.cerrado,CERRADO_SPRITES[lvl.cfg.flora[i%lvl.cfg.flora.length]],x,GROUND_Y-65,65,65);
    }
    ctx.restore();
    if (lvl.cfg.id === 3) {
      const wfX = 320 - ((cameraX * 0.35) % 480);
      drawSheetRegion(sheets.cerrado, CERRADO_SPRITES.waterfall, wfX, GROUND_Y - 54, 48, 72);
    }

    ctx.save();
    ctx.translate(-Math.floor(cameraX), 0);

    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.filter = 'blur(0.5px)';
    for (const d of lvl.decors) {
      if (d.x + d.w < cameraX - 20 || d.x > cameraX + canvas.width + 20) continue;
      drawSheetRegion(sheets.cerrado, CERRADO_SPRITES[d.sprite], d.x, d.y, d.w, d.h);
    }
    ctx.restore();

    const tileW = 64;
    const firstTile = Math.floor(cameraX / tileW) * tileW;
    for (let tx = firstTile; tx < cameraX + canvas.width + tileW; tx += tileW) {
      ctx.save();
      ctx.beginPath();
      let cursor = tx;
      for (const p of lvl.pits) {
        if (p.x + p.w <= tx || p.x >= tx + tileW) continue;
        const edge = Math.max(tx,p.x);
        if (edge > cursor) ctx.rect(cursor,GROUND_Y,edge-cursor,canvas.height-GROUND_Y);
        cursor = Math.max(cursor,p.x+p.w);
      }
      if (cursor < tx+tileW) ctx.rect(cursor,GROUND_Y,tx+tileW-cursor,canvas.height-GROUND_Y);
      ctx.clip();
      drawSheetRegion(sheets.cerrado, CERRADO_SPRITES.tile_ground, tx, GROUND_Y, tileW, canvas.height - GROUND_Y);
      ctx.restore();
    }
    for (const p of lvl.pits) {
      if (p.x+p.w < cameraX || p.x > cameraX+canvas.width) continue;
      drawSheetRegion(sheets.cerrado, CERRADO_SPRITES.waterfall, p.x, GROUND_Y, p.w, canvas.height-GROUND_Y);
    }

    for (const plat of lvl.platforms) {
      drawSheetRegion(sheets.cerrado, CERRADO_SPRITES.tile_plat, plat.x, plat.y, plat.w, plat.h);
    }

    for (const blk of lvl.blocks) {
      const by = blk.y - blk.bounce;
      ctx.fillStyle = blk.hit ? '#6d594a' : '#f4a226';
      ctx.fillRect(blk.x, by, blk.w, blk.h);
      ctx.strokeStyle = '#2b1b0e';
      ctx.strokeRect(blk.x + 0.5, by + 0.5, blk.w - 1, blk.h - 1);
      if (!blk.hit) {
        ctx.fillStyle = '#fff8d6';
        ctx.fillRect(blk.x + 7, by + 4, 4, 2);
        ctx.fillRect(blk.x + 9, by + 6, 2, 4);
        ctx.fillRect(blk.x + 8, by + 12, 2, 2);
      }
    }

    for (const s of lvl.seeds) {
      if (s.collected) continue;
      const offsetY = Math.sin(s.bob) * 2.5;
      drawSheetRegion(sheets.seed, [0.22, 0.16, 0.56, 0.68], s.x, s.y + offsetY, 16, 18);
    }

    for (const obs of lvl.obstacles) {
      if (obs.defeated) continue;
      let spriteKey = obs.type;
      if (obs.type === 'branch') spriteKey = 'bush';
      else if (obs.type === 'roller') { if(sheets.roller) { drawObstacle(sheets.roller, [Math.floor(obs.anim*12)%8/8,.29,.125,.38],obs.x-3,obs.y-3,32,29,obs.vx<0); continue; } spriteKey = 'bush'; }
      else if (obs.type === 'bird') {
        if (sheets.bird) {
          const frame = Math.floor(obs.anim * 12) % 8;
          drawSheetRegion(sheets.bird, [frame / 8, 0.27, 1 / 8, 0.42], obs.x - 2, obs.y - 5, 30, 33.6, obs.vx < 0);
        } else {
          drawSheetRegion(sheets.cerrado, CERRADO_SPRITES.ave, obs.x, obs.y, obs.w, obs.h, obs.vx < 0);
        }
        continue;
      }

      const isBird = obs.type === 'bird';
      const isTerrestrialObs = (obs.type === 'rock' || obs.type === 'cactus' || obs.type === 'branch' || obs.type === 'roller');
      drawObstacle(sheets.cerrado, CERRADO_SPRITES[spriteKey], obs.x, obs.y, obs.w, obs.h);
    }

    const npcPose = state === 'DELIVER' ? NPC_FRAMES.point : NPC_FRAMES.notes;
    drawSheetRegion(sheets.npc, npcPose, lvl.npcX, GROUND_Y - 58, 32, 58, true);

    if (state === 'DELIVER') {
      const bx = lvl.npcX - 110;
      const by = GROUND_Y - 112;
      ctx.fillStyle = 'rgba(10, 20, 16, 0.94)';
      ctx.fillRect(bx, by, 240, 42);
      ctx.strokeStyle = '#7ee0b8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(bx, by, 240, 42);
      ctx.fillStyle = '#ffcf40';
      ctx.font = 'bold 9px monospace';
      ctx.fillText('Engenharia Ambiental relata:', bx + 8, by + 13);
      ctx.fillStyle = '#fff3b0';
      ctx.font = '8px monospace';
      const curText = lvl.cfg.curiosity.replace('Engenheira Ambiental: ', '');
      ctx.fillText(curText.substring(0, 42), bx + 8, by + 25);
      if (curText.length > 42) {
        ctx.fillText(curText.substring(42, 84), bx + 8, by + 35);
      }
    }

    if (!(player.invulnTimer > 0 && Math.floor(player.invulnTimer * 16) % 2 === 0)) {
      const pose = player.pose || 'idle';
      const fps = {idle:5,walk:10,run:14,jump:12,crouch:14,attack:32}[pose];
      let frame = Math.floor(player.animTimer * fps) % 8;
      if (pose === 'crouch') frame = Math.min(4, Math.floor(player.animTimer * fps));
      if (pose === 'attack') frame = Math.min(7, Math.floor(player.animTimer * fps));
      if (pose === 'jump') frame = player.vy < 0 ? Math.min(4, 1+Math.floor(player.animTimer*12)) : Math.min(7, 5+Math.floor(Math.max(0,player.vy)/150));
      const sheet = sheets['wolf_'+pose];
      if (sheet) {
        const [sx,sy,sw,sh] = wolfBoxes['wolf_'+pose][frame];
        const scale = 46 / 345;
        const dw = sw * scale, dh = sh * scale;
        drawSheetRegion(sheet,[sx/2048,sy/682,sw/2048,sh/682],player.x+player.w/2-dw/2,player.y+player.h-dh,dw,dh,player.facing===-1);
      }
      else drawSheetRegion(sheets.lobo,LOBO_FRAMES.idle[0],player.x-4,player.y+player.h-44,30,44,player.facing===-1);
    }

    for (const p of particles) {
      ctx.fillStyle = p.color;
      ctx.fillRect(Math.round(p.x), Math.round(p.y), 3, 3);
    }

    ctx.restore();

    if (state === 'PLAY' || state === 'DELIVER') {
      ctx.fillStyle = 'rgba(10, 22, 16, 0.55)';
      ctx.fillRect(6, 6, 178, 18);
      ctx.fillRect(canvas.width - 134, 6, 128, 18);

      for (let i = 0; i < 3; i++) {
        if (i < lives) {
          drawPixelHeart(12 + i * 16, 8);
        } else {
          ctx.fillStyle = '#3a4f45';
          ctx.fillRect(12 + i * 16, 11, 12, 10);
        }
      }

      drawSheetRegion(sheets.seed, [0.22, 0.16, 0.56, 0.68], 62, 8, 12, 14);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 10px monospace';
      ctx.fillText(`x${String(levelData.collectedInLevel).padStart(2, '0')}`, 76, 18);

      ctx.fillStyle = '#ffcf40';
      ctx.fillText(`1-${lvl.cfg.id}`, 110, 18);

      ctx.fillStyle = '#a7f3d0';
      ctx.fillText(String(score).padStart(6, '0'), 138, 18);

      ctx.fillStyle = '#ffffff';
      ctx.fillText(formatTime(elapsedMs), canvas.width - 126, 18);
    }
  }

  function finishLevelDialog() {
    state = 'END';
    const levelBonus = 500;
    const noHitBonus = levelHits === 0 ? 400 : 0;
    score += levelBonus + noHitBonus;
    totalRunDelivered += levelData.collectedInLevel;

    const save = Storage.get();
    if (currentLevelIdx + 2 > save.unlockedLevel && currentLevelIdx + 2 <= LEVELS.length) {
      save.unlockedLevel = currentLevelIdx + 2;
    }
    Storage.save(save);

    if (levelHits === 0) Storage.unlockAch('no_hit');
    if (currentLevelIdx === 2) Storage.unlockAch('springs');
    if (levelData.collectedInLevel >= levelData.seeds.length && levelData.seeds.length > 0) {
      Storage.unlockAch('hero');
    }

    const isLast = currentLevelIdx === LEVELS.length - 1;
    if (isLast) {
      if (runInitialLevel === 0) Storage.unlockAch('guardian');
      saveRunRecord(true);
      AudioFX.stopBGM();
    }

    document.getElementById('end-title').textContent = isLast ? 'CERRADO PROTEGIDO!' : `${LEVELS[currentLevelIdx].name} CONCLUÍDA!`;
    document.getElementById('end-content').innerHTML = `
      <p><strong>Engenheira Ambiental:</strong> "${LEVELS[currentLevelIdx].curiosity}"</p><br>
      <p>Sementes Entregues na Fase: <strong>${levelData.collectedInLevel}</strong></p>
      <p>Bônus Sem Colisões: <strong>+${noHitBonus} pts</strong></p>
      <p>Pontuação Total: <strong>${score}</strong></p>
      <p>Tempo da Run: <strong>${formatTime(elapsedMs)}</strong></p>
    `;
    const btnNext = document.getElementById('btn-next');
    btnNext.textContent = isLast ? 'JOGAR NOVAMENTE' : 'PRÓXIMA FASE';
    btnNext.onclick = () => isLast ? startRun(0) : startLevel(currentLevelIdx + 1);
    document.getElementById('menu-end').classList.remove('hidden');
  }

  function endGame(won) {
    state = 'END';
    document.getElementById('touch-controls').classList.remove('active');
    AudioFX.stopBGM();
    saveRunRecord(false);
    document.getElementById('end-title').textContent = won ? 'AVENTURA CONCLUÍDA!' : 'FIM DE JOGO';
    document.getElementById('end-content').innerHTML = `
      <p>Pontuação Final: <strong>${score}</strong></p>
      <p>Sementes Coletadas: <strong>${totalRunSeeds}</strong> | Entregues: <strong>${totalRunDelivered}</strong></p>
      <p>Tempo Total: <strong>${formatTime(elapsedMs)}</strong></p>
    `;
    const btnNext = document.getElementById('btn-next');
    btnNext.textContent = 'TENTAR NOVAMENTE';
    btnNext.onclick = () => startRun(currentLevelIdx);
    document.getElementById('menu-end').classList.remove('hidden');
  }

  function saveRunRecord(won) {
    const save = Storage.get();
    if (score > save.bestScore) save.bestScore = score;
    if (totalRunSeeds > save.maxSeeds) save.maxSeeds = totalRunSeeds;
    if (won && runInitialLevel === 0 && currentLevelIdx === LEVELS.length - 1 && (save.bestTimeMs === null || elapsedMs < save.bestTimeMs)) {
      save.bestTimeMs = elapsedMs;
    }
    save.history.unshift({
      date: new Date().toLocaleDateString('pt-BR'),
      score, seeds: totalRunSeeds, time: formatTime(elapsedMs), diff: difficulty.toUpperCase()
    });
    save.history = save.history.slice(0, 8);
    Storage.save(save);
  }

  function hideAllMenus() {
    ['menu-main', 'menu-sub', 'menu-pause', 'menu-end'].forEach(id => {
      document.getElementById(id).classList.add('hidden');
    });
  }

  function setPause(paused) {
    if (paused) {
      state = 'PAUSE';
      document.getElementById('touch-controls').classList.remove('active');
      document.getElementById('menu-pause').classList.remove('hidden');
    } else {
      state = 'PLAY';
      if (playMode === 'celular') document.getElementById('touch-controls').classList.add('active');
      document.getElementById('menu-pause').classList.add('hidden');
    }
  }

  function openSubMenu(title, html) {
    hideAllMenus();
    document.getElementById('sub-title').textContent = title;
    document.getElementById('sub-content').innerHTML = html;
    document.getElementById('menu-sub').classList.remove('hidden');
  }

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      playMode = btn.dataset.mode;
      const infoBar = document.getElementById('info-controls');
      if (playMode === 'celular') {
        infoBar.textContent = 'Modo Celular Ativado: Utilize os botões virtuais na tela.';
      } else {
        infoBar.textContent = '[A/D] Mover | [W/Espaço] Pular | [S] Agachar | [J/Z] Chute | [P] Pausar';
      }
    };
  });

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      difficulty = btn.dataset.diff;
    };
  });

  document.getElementById('btn-play').onclick = () => startRun(0);
  document.getElementById('btn-resume').onclick = () => setPause(false);
  document.getElementById('btn-restart').onclick = () => startRun(0);
  document.getElementById('btn-quit').onclick = () => { state = 'MENU'; document.getElementById('touch-controls').classList.remove('active'); AudioFX.stopBGM(); hideAllMenus(); document.getElementById('menu-main').classList.remove('hidden'); };
  document.getElementById('btn-end-menu').onclick = () => { state = 'MENU'; document.getElementById('touch-controls').classList.remove('active'); hideAllMenus(); document.getElementById('menu-main').classList.remove('hidden'); };
  document.getElementById('btn-sub-back').onclick = () => { hideAllMenus(); document.getElementById('menu-main').classList.remove('hidden'); };

  document.getElementById('btn-levels').onclick = () => {
    const save = Storage.get();
    const cards = LEVELS.map((l, idx) => {
      const unlocked = (idx + 1) <= save.unlockedLevel;
      return `
        <div class="level-card ${unlocked ? '' : 'locked'}" ${unlocked ? `onclick="window.__selectLevel(${idx})"` : ''}>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>${unlocked ? '🌿' : '🔒'} <strong>${l.name}</strong></span>
            <span style="color:${unlocked ? '#ffcf40' : '#7a998b'};font-size:11px;">${unlocked ? '▶ JOGAR' : 'BLOQUEADA'}</span>
          </div>
          <p style="font-size:11px;color:#a7f3d0;margin-top:2px;">"Engenheira: ${l.curiosity.replace('Engenheira Ambiental: ', '')}"</p>
        </div>
      `;
    }).join('');
    openSubMenu('RELATÓRIO DE FASES & DIÁLOGOS', cards);
  };
  window.__selectLevel = (idx) => startRun(idx);

  document.getElementById('btn-howto').onclick = () => {
    openSubMenu('COMO JOGAR', `
      <p><strong>PC:</strong> [A/D] Mover | [W/Espaço] Pular & Pulo Duplo | [S] Agachar | [J/Z] Chute.</p>
      <p><strong>Celular:</strong> Utilize os botões direcionais (◀ ▶), o botão de agachar (▼), pulo e chute diretamente na tela horizontal.</p>
      <p><strong>Dica:</strong> Colete sementes e desvie dos animais e remova apenas obstáculos inanimados!</p>
    `);
  };

  document.getElementById('btn-missions').onclick = () => {
    openSubMenu('MISSÕES AMBIENTAIS', LEVELS.map(l => `<p style="margin-bottom:8px;"><strong>${l.name}:</strong> ${l.mission}</p>`).join(''));
  };

  document.getElementById('btn-records').onclick = () => {
    const s = Storage.get();
    const rows = s.history.length
      ? s.history.map(h => `<p>• [${h.date}] ${h.diff} — <strong>${h.score} pts</strong> | ${h.seeds} sementes | ${h.time}</p>`).join('')
      : '<p>Nenhuma tentativa registrada ainda.</p>';
    openSubMenu('RECORDES PESSOAIS', `
      <p><strong>Maior Pontuação:</strong> ${s.bestScore}</p>
      <p><strong>Máximo de Sementes:</strong> ${s.maxSeeds}</p>
      <p><strong>Melhor Tempo Completo:</strong> ${s.bestTimeMs ? formatTime(s.bestTimeMs) : '--:--:---'}</p>
      <hr style="margin:8px 0;border-color:#2e5a44;">
      ${rows}
    `);
  };

  document.getElementById('btn-achievements').onclick = () => {
    const s = Storage.get();
    openSubMenu('GALERIA DE CONQUISTAS', ACHIEVEMENTS_DEF.map(a => {
      const ok = s.achievements.includes(a.id);
      return `<p style="margin-bottom:6px;color:${ok ? '#ffcf40' : '#7a998b'};">${ok ? '★' : '☆'} <strong>${a.name}:</strong> ${a.desc}</p>`;
    }).join(''));
  };

  let lastTs = performance.now();
  function loop(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000);
    lastTs = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  loadAllAssets().then(() => {
    levelData = buildLevel(0);
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
