<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerta Fauna - Aventura pelo Cerrado</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #0d1612;

    font-family: monospace;
    display: flex;

    justify-content: center;

}

#game {

    width: min(96vw, 1100px);
    aspect-ratio: 16/9;
    background: #183327;
    border: 4px solid #52b788;
    overflow: hidden;
}

canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    display: block;
}

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(10,20,16,.94);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 12px;

}

.hidden {
    display: none !important;
}

h1 {
    color: #ffcf40;

    text-shadow: 3px 3px #254b36;
}

h2 {
    color: #95e6bb;
    margin: 8px;
    font-size: clamp(12px,2vw,20px);
}

button {
    background: #238b68;
    color: white;
    border: 2px solid #9ff5d2;
    padding: 9px 14px;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #36ac83;
}

button.active {
    background: #e0a321;
    color: #142018;
}

button:disabled {
    opacity: .4;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 8px;
    margin: 10px;
}

.options {
    display: flex;
    gap: 6px;
    margin: 5px;
}

.panel {
    background: #12221b;
    border: 2px solid #52b788;
    padding: 12px;
    width: 90%;
    max-width: 650px;
    max-height: 60%;
    overflow: auto;
    line-height: 1.6;
    margin: 10px;
}

.panel button {
    margin: 5px;
}

#info {
    color: #a8cdb9;
    margin: 12px;
    text-align: center;
    font-size: 12px;
}

#touch {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 5;
}

.touchButton {
    position: absolute;
    bottom: 12px;
    width: 48px;
    height: 48px;
    padding: 0;
    border-radius: 8px;
    background: #238b6899;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
}

#left { left: 10px; }
#right { left: 65px; }
#down { left: 120px; }
#jump { right: 10px; background: #e0a32199; }
#kick { right: 65px; }
#mobilePause { right: 10px; top: 35px; }

@media(max-width:600px) {
    button {

        padding: 5px 8px;
    }

    .touchButton {
        width: 36px;
        height: 36px;
    }

    #down { left: 94px; }
    #kick { right: 52px; }

</style>
</head>

<body>

<div id="game">

<canvas id="canvas" width="480" height="270"></canvas>

<div id="menu" class="overlay">
    <h1>ALERTA FAUNA</h1>
    <h2>AVENTURA PELO CERRADO</h2>

    <div class="options">
        <button id="pc" class="active">COMPUTADOR</button>
        <button id="mobile">CELULAR</button>
    </div>

    <div class="options">
        <button data-diff="facil">FÁCIL</button>
        <button data-diff="normal" class="active">NORMAL</button>

    </div>

        <button id="levels">FASES</button>
        <button id="howto">COMO JOGAR</button>
        <button id="missions">MISSÕES</button>

</div>

</div>

<div id="endMenu" class="overlay hidden">
    <h1 id="endTitle"></h1>
    <div id="endContent" class="panel"></div>
    <div class="grid">

        <button id="endBack">MENU</button>

</div>

    <button id="right" class="touchButton">▶</button>
    <button id="down" class="touchButton">▼</button>
    <button id="jump" class="touchButton">PULAR</button>
    <button id="kick" class="touchButton">CHUTE</button>

</div>

</div>

<div id="info">
    A/D: Mover |
    W/ESPAÇO/BACKSPACE: Pular |
    S: Agachar |
    J/Z: Chute |
    P: Pausar
</div>

<script>
(() => {

"use strict";

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = 480;
const H = 270;
const GROUND = 224;

const sources = {
    wolf: "assets/Sprite Sheet de Lobo em Ação.png",
    cerrado: "assets/Kit Pixel Art do Cerrado Brasileiro.png",
    bird: "assets/Sprite de Pássaro Azul em Voo.png",
    seed: "assets/seed.png",
    npc: "assets/npc.jpg"
};

const images = {};
let birdFrames = [];

async function loadAssets() {
    await Promise.all(
        Object.entries(sources).map(([name,path]) =>
            new Promise(resolve => {
                const img = new Image();

                img.onload = () => {
                    images[name] = processImage(img,name);
                    resolve();
                };

                img.onerror = () => {
                    images[name] = null;
                    console.warn("Imagem não encontrada:",path);
                    resolve();
                };

                img.src = path;
            })
        )
    );

    prepareBirdFrames();
}

function processImage(img,type) {
    const c = document.createElement("canvas");

    c.width = img.width;
    c.height = img.height;

    const g = c.getContext("2d");
    g.drawImage(img,0,0);

    if(type === "bird") return c;

    try {
        const data = g.getImageData(0,0,c.width,c.height);
        const p = data.data;

        for(let i=0;i<p.length;i+=4) {
            const r=p[i], green=p[i+1], b=p[i+2];

            if(type==="wolf" || type==="seed") {
                if(r>242 && green>242 && b>242) {
                    p[i+3]=0;
                }
            }

            if(type==="npc") {
                if(r>155 && b>120 && green<115 && r-green>55) {
                    p[i+3]=0;
                }
            }

            if(type==="cerrado") {
                const y=Math.floor(i/4/c.width);

                if(y>c.height*.34 && y<c.height*.77 &&
                   r>155 && r<205 &&
                   green>175 && green<220 && b>215) {
                    p[i+3]=0;
                }
            }
        }

        g.putImageData(data,0,0);
    } catch(e) {}

    return c;
}

// ======================================
// ANIMAÇÃO DO PÁSSARO
// ======================================

function prepareBirdFrames() {
    const img=images.bird;

    if(!img) return;

    const cellWidth=Math.floor(img.width/8);

    birdFrames=[];

    for(let i=0;i<8;i++) {
        birdFrames.push([
            i*cellWidth,
            Math.floor(img.height*.20),
            cellWidth,
            Math.floor(img.height*.60)
        ]);
    }
}

function drawBird(bird) {
    const img=images.bird;

    if(!img || birdFrames.length===0) {
        drawSprite(
            images.cerrado,
            SPRITES.ave,
            bird.x,bird.y,bird.w,bird.h,
            bird.vx<0,"#369adf"
        );
        return;
    }

    const frame=birdFrames[
        Math.floor(bird.animation*12)%8
    ];

    const dw=34;
    const dh=34;

    ctx.save();

    ctx.translate(
        Math.round(bird.x+bird.w/2),
        Math.round(bird.y+bird.h/2)
    );

    if(bird.vx<0) ctx.scale(-1,1);

    ctx.drawImage(
        img,
        frame[0],frame[1],frame[2],frame[3],
        -dw/2,-dh/2,dw,dh
    );

    ctx.restore();
}

// ======================================
// SPRITES DO LOBO
// ======================================

const WOLF={
    idle:[
        [.016,.038,.072,.170],
        [.116,.038,.072,.170],
        [.216,.038,.072,.170],
        [.316,.038,.072,.170]
    ],

    walk:[
        [.512,.038,.072,.170],
        [.612,.038,.072,.170],
        [.712,.038,.072,.170],
        [.812,.038,.072,.170]
    ],

    run:[
        [.018,.295,.078,.165],
        [.138,.295,.078,.165],
        [.258,.295,.078,.165],
        [.378,.295,.078,.165]
    ],

    jump:[
        [.500,.295,.078,.165],
        [.610,.285,.078,.165],
        [.715,.275,.078,.175]
    ],

    fall:[
        [.810,.275,.078,.175],
        [.890,.295,.078,.155]
    ],

    crouch:[
        [.225,.580,.075,.130],
        [.342,.610,.082,.100]
    ],

    attack:[
        [.505,.770,.078,.175],
        [.605,.760,.098,.185],
        [.755,.770,.078,.175]
    ],

    doubleJump:[
        [.875,.770,.078,.175]
    ]
};

// ======================================
// SPRITES DO CERRADO
// ======================================

const SPRITES={
    day:[0,0,1,.34],
    sunset:[.005,.785,.302,.205],
    night:[.311,.785,.231,.205],
    rain:[.546,.785,.343,.205],

    waterfall:[.928,.785,.068,.11],

    ground:[.007,.435,.102,.075],
    platform:[.113,.435,.108,.075],

    rock:[.240,.525,.075,.095],
    bush:[.730,.575,.072,.075],
    cactus:[.440,.525,.032,.098],

    ipe_yellow:[.462,.432,.160,.220],
    ipe_pink:[.752,.432,.135,.220],
    tree:[.885,.432,.095,.220],

    tatu:[.105,.625,.118,.145],
    capivara:[.228,.625,.080,.145],
    anta:[.310,.625,.095,.145],
    seriema:[.402,.615,.068,.155],
    ave:[.468,.635,.075,.135],
    lagarto:[.548,.665,.095,.105],
    cobra:[.648,.665,.100,.105],
    onca:[.820,.625,.105,.145],
    sapo:[.925,.685,.048,.085]
};

function drawSprite(img,rect,x,y,w,h,flip=false,color="#52b788") {
    if(!img || !rect) {
        ctx.fillStyle=color;
        ctx.fillRect(x,y,w,h);
        return;
    }

    const sx=Math.floor(rect[0]*img.width);
    const sy=Math.floor(rect[1]*img.height);
    const sw=Math.floor(rect[2]*img.width);
    const sh=Math.floor(rect[3]*img.height);

    ctx.save();

    ctx.translate(
        Math.round(x+(flip?w:0)),
        Math.round(y)
    );

    if(flip) ctx.scale(-1,1);

    ctx.drawImage(
        img,sx,sy,sw,sh,
        0,0,Math.round(w),Math.round(h)
    );

    ctx.restore();
}

// ======================================
// FASES
// ======================================

const LEVELS=[
    {
        name:"CERRADO ABERTO",
        length:3200,
        bg:"day",
        flora:["ipe_yellow","bush","cactus"],
        fauna:["tatu","seriema","ave"],
        mission:"Conhecer a biodiversidade do Cerrado.",
        curiosity:"O lobo-guará ajuda a dispersar sementes de plantas nativas."
    },
    {
        name:"CERRADO DENSO",
        length:3600,
        bg:"sunset",
        flora:["ipe_pink","tree","bush"],
        fauna:["tatu","anta","lagarto"],
        mission:"Recuperar áreas degradadas.",
        curiosity:"Muitas plantas do Cerrado possuem raízes profundas que ajudam na sobrevivência durante a seca."
    },
    {
        name:"REGIÃO DE NASCENTES",
        length:4000,
        bg:"rain",
        flora:["ipe_yellow","tree","bush"],
        fauna:["capivara","sapo","ave"],
        mission:"Proteger as nascentes.",
        curiosity:"O Cerrado abriga nascentes importantes para diversas bacias hidrográficas brasileiras."
    },
    {
        name:"TRAVESSIA DA FAUNA",
        length:4400,
        bg:"night",
        flora:["tree","cactus","bush"],
        fauna:["onca","cobra","anta"],
        mission:"Prevenir atropelamentos de animais silvestres.",
        curiosity:"Passagens de fauna ajudam os animais a atravessar rodovias com segurança."
    }
];

const ACHIEVEMENTS=[
    ["first","Primeira Semente","Colete uma semente."],
    ["fifty","Pequeno Protetor","Colete 50 sementes."],
    ["nohit","Corredor da Natureza","Termine uma fase sem colisões."],
    ["water","Protetor das Nascentes","Conclua a terceira fase."],
    ["guardian","Guardião do Cerrado","Conclua as quatro fases."],
    ["hero","Herói Ambiental","Colete todas as sementes de uma fase."]
];

// ======================================
// SALVAMENTO
// ======================================

let save={
    bestScore:0,
    bestTime:null,
    totalSeeds:0,
    maxSeeds:0,
    unlocked:1,
    achievements:[]
};

try {
    Object.assign(
        save,
        JSON.parse(localStorage.getItem("alerta_fauna_v3")||"{}")
    );
} catch(e) {}

function saveGame() {
    try {
        localStorage.setItem(
            "alerta_fauna_v3",
            JSON.stringify(save)
        );
    } catch(e) {}
}

function unlock(id) {
    if(!save.achievements.includes(id)) {
        save.achievements.push(id);
        saveGame();
    }
}

// ======================================
// ÁUDIO
// ======================================

let audio;

function sound(freq,duration=.12,end=freq) {
    try {
        const Audio=window.AudioContext||window.webkitAudioContext;

        if(!audio) audio=new Audio();

        if(audio.state==="suspended") audio.resume();

        const o=audio.createOscillator();
        const g=audio.createGain();

        o.type="square";

        o.frequency.setValueAtTime(freq,audio.currentTime);

        o.frequency.exponentialRampToValueAtTime(
            Math.max(40,end),
            audio.currentTime+duration
        );

        g.gain.setValueAtTime(.04,audio.currentTime);

        g.gain.exponentialRampToValueAtTime(
            .001,audio.currentTime+duration
        );

        o.connect(g);
        g.connect(audio.destination);

        o.start();
        o.stop(audio.currentTime+duration);

    } catch(e) {}
}

// ======================================
// VARIÁVEIS
// ======================================

let state="MENU";
let mode="pc";
let difficulty="normal";

const DIFF={
    facil:.85,
    normal:1,
    dificil:1.25
};

let levelIndex=0;
let startIndex=0;
let level=null;

let score=0;
let lives=3;
let totalSeeds=0;
let delivered=0;
let elapsed=0;
let camera=0;
let hits=0;
let particles=[];

const player={
    x:48,
    y:GROUND-44,
    w:22,
    h:44,
    vx:0,
    vy:0,
    facing:1,
    grounded:true,
    jumps:2,
    crouching:false,
    attack:0,
    invulnerable:0,
    animation:0
};

const keys={};

function clearKeys() {
    Object.keys(keys).forEach(k=>keys[k]=false);
}

// ======================================
// CONTROLES
// ======================================

window.addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();

    if(state==="PLAY" &&
       [" ","backspace","arrowup","arrowdown",
        "arrowleft","arrowright"].includes(k)) {
        e.preventDefault();
    }

    if(e.repeat) return;

    keys[k]=true;

    if(k==="p" || k==="escape") {
        pause();
        return;
    }

    if(state!=="PLAY") return;

    if(["w"," ","backspace","arrowup"].includes(k)) {
        jump();
    }

    if(k==="j" || k==="z") attack();
});

window.addEventListener("keyup",e=>{
    const k=e.key.toLowerCase();
    keys[k]=false;

    if(["w"," ","backspace","arrowup"].includes(k) &&
       player.vy<-110) {
        player.vy*=.55;
    }
});

window.addEventListener("blur",()=>{
    clearKeys();

    if(state==="PLAY") pause();
});

function bindTouch(id,key,action) {
    const b=$(id);

    b.addEventListener("pointerdown",e=>{
        e.preventDefault();

        if(state!=="PLAY") return;

        b.setPointerCapture(e.pointerId);

        keys[key]=true;

        if(action) action();
    });

    const release=()=>keys[key]=false;

    b.addEventListener("pointerup",release);
    b.addEventListener("pointercancel",release);
    b.addEventListener("lostpointercapture",release);
}

bindTouch("left","a");
bindTouch("right","d");
bindTouch("down","s");
bindTouch("jump","w",jump);
bindTouch("kick","j",attack);

$("mobilePause").onclick=pause;

function jump() {
    if(state!=="PLAY") return;

    if(player.crouching) {
        const standing={
            x:player.x,
            y:player.y-16,
            w:22,h:44
        };

        if(level.obstacles.some(o=>
            o.type==="branch" && overlap(standing,o)
        )) return;

        player.crouching=false;
        player.y-=16;
        player.h=44;
    }

    if(player.grounded) {
        player.vy=-350;
        player.grounded=false;
        player.jumps=1;

        sound(260,.15,520);

    } else if(player.jumps>0) {
        player.vy=-310;
        player.jumps=0;

        sound(380,.15,700);
    }
}

function attack() {
    if(state==="PLAY" && player.attack<=0) {
        player.attack=.24;
        sound(180,.1,80);
    }
}

// ======================================
// GERAÇÃO DO MAPA
// ======================================

function buildLevel(index) {
    const cfg=LEVELS[index];
    const mult=DIFF[difficulty];

    const data={
        cfg,
        pits:[],
        platforms:[],
        blocks:[],
        seeds:[],
        obstacles:[],
        decorations:[],
        collected:0,
        npcX:cfg.length-130
    };

    for(let x=620;x<cfg.length-450;x+=650) {
        data.pits.push({
            x,
            w:54+index*5
        });
    }

    for(let x=260;x<cfg.length-360;x+=270) {
        const y=Math.floor(x/270)%2===0?140:162;

        data.platforms.push({
            x,y,w:70,h:16
        });

        data.blocks.push({
            x:x+26,
            y:y-46,
            w:18,h:18,
            hit:false
        });

        data.seeds.push({
            x:x+10,y:y-20,collected:false
        });

        data.seeds.push({
            x:x+44,y:y-20,collected:false
        });
    }

    for(let x=180;x<cfg.length-300;x+=190) {
        if(!data.pits.some(p=>
            x>p.x-20 && x<p.x+p.w+20
        )) {
            data.seeds.push({
                x,y:GROUND-24,collected:false
            });
        }
    }

    const types=[
        "rock","bush","cactus",
        "branch","roller","bird"
    ];

    let n=0;

    for(let x=340;x<cfg.length-340;x+=Math.round(230/mult)) {

        if(data.pits.some(p=>
            x>p.x-100 && x<p.x+p.w+100
        )) continue;

        const type=types[(n+++index)%types.length];

        if(type==="bird") {
            data.obstacles.push({
                type,
                x,
                y:GROUND-55,
                w:26,h:20,
                baseX:x,
                baseY:GROUND-55,
                vx:-65*mult,
                animation:0,
                passed:false,
                collided:false,
                removed:false
            });

        } else if(type==="branch") {
            data.obstacles.push({
                type,
                x,
                y:GROUND-65,
                w:44,h:30,
                removed:false
            });

        } else if(type==="roller") {
            data.obstacles.push({
                type,
                x,
                y:GROUND-24,
                w:24,h:24,
                baseX:x,
                vx:-52*mult,
                removed:false
            });

        } else {
            const h=type==="cactus"?38:24;

            data.obstacles.push({
                type,x,
                y:GROUND-h,
                w:26,h,
                removed:false
            });
        }
    }

    for(let x=90,i=0;x<cfg.length-200;x+=175,i++) {
        const flora=cfg.flora[i%cfg.flora.length];
        const h=flora==="bush"?22:54;

        data.decorations.push({
            sprite:flora,
            x,y:GROUND-h,
            w:46,h
        });

        if(i%2===0) {
            const fauna=cfg.fauna[
                Math.floor(i/2)%cfg.fauna.length
            ];

            data.decorations.push({
                sprite:fauna,
                x:x+58,
                y:GROUND-22,
                w:28,h:22
            });
        }
    }

    return data;
}

// ======================================
// INICIAR JOGO
// ======================================

function startRun(index=0) {
    score=0;
    lives=3;
    totalSeeds=0;
    delivered=0;
    elapsed=0;
    startIndex=index;

    startLevel(index);
}

function startLevel(index) {
    levelIndex=index;
    level=buildLevel(index);

    hits=0;
    camera=0;
    particles=[];

    clearKeys();

    Object.assign(player,{
        x:48,
        y:GROUND-44,
        w:22,h:44,
        vx:0,vy:0,
        facing:1,
        grounded:true,
        jumps:2,
        crouching:false,
        attack:0,
        invulnerable:0,
        animation:0
    });

    state="PLAY";

    hideMenus();
    updateTouch();
}

function overlap(a,b) {
    return a.x<b.x+b.w &&
           a.x+a.w>b.x &&
           a.y<b.y+b.h &&
           a.y+a.h>b.y;
}

// ======================================
// PARTÍCULAS
// ======================================

function burst(x,y,color,count=8) {
    for(let i=0;i<count;i++) {
        particles.push({
            x,y,
            vx:(Math.random()-.5)*140,
            vy:-40-Math.random()*120,
            life:.4+Math.random()*.2,
            color
        });
    }
}

function damage(fell=false) {
    if(player.invulnerable>0 && !fell) return;

    lives--;
    hits++;

    sound(130,.2,60);

    burst(player.x+11,player.y+22,"#ff6b6b",12);

    if(lives<=0) {
        gameOver();
        return;
    }

    player.invulnerable=1.5;

    if(fell) {
        player.x=Math.max(40,player.x-120);

        for(const p of level.pits) {
            if(player.x+player.w>p.x &&
               player.x<p.x+p.w) {
                player.x=Math.max(40,p.x-player.w-10);
            }
        }

        player.h=44;
        player.crouching=false;
        player.y=GROUND-44;
        player.vy=0;
        player.jumps=2;
        player.grounded=true;
    }
}

// ======================================
// FÍSICA DO JOGO
// ======================================

function update(dt) {
    if(state!=="PLAY") return;

    elapsed+=dt*1000;

    const left=keys.a||keys.arrowleft;
    const right=keys.d||keys.arrowright;
    const down=keys.s||keys.arrowdown;

    if(down && player.grounded) {
        if(!player.crouching) {
            player.crouching=true;
            player.y+=16;
            player.h=28;
        }

    } else if(player.crouching) {
        const standing={
            x:player.x,
            y:player.y-16,
            w:22,h:44
        };

        const blocked=level.obstacles.some(o=>
            o.type==="branch" && overlap(standing,o)
        );

        if(!blocked) {
            player.crouching=false;
            player.y-=16;
            player.h=44;
        }
    }

    const speed=160*DIFF[difficulty]*
        (player.crouching?.45:1);

    let target=0;

    if(left && !right) {
        target=-speed;
        player.facing=-1;

    } else if(right && !left) {
        target=speed;
        player.facing=1;
    }

    player.vx+=(target-player.vx)*Math.min(1,dt*18);

    player.x+=player.vx*dt;

    player.x=Math.max(
        10,
        Math.min(level.cfg.length-player.w,player.x)
    );

    player.animation+=dt;

    player.attack=Math.max(0,player.attack-dt);

    player.invulnerable=Math.max(
        0,player.invulnerable-dt
    );

    const previousBottom=player.y+player.h;
    const previousTop=player.y;

    player.vy+=860*dt;
    player.y+=player.vy*dt;

    player.grounded=false;

    const foot=player.x+player.w/2;

    const overPit=level.pits.some(p=>
        foot>p.x && foot<p.x+p.w
    );

    if(!overPit &&
       player.vy>=0 &&
       previousBottom<=GROUND+4 &&
       player.y+player.h>=GROUND) {

        player.y=GROUND-player.h;
        player.vy=0;
        player.grounded=true;
        player.jumps=2;
    }

    for(const p of level.platforms) {
        if(player.vy>=0 &&
           previousBottom<=p.y+4 &&
           player.y+player.h>=p.y &&
           player.x+player.w>p.x &&
           player.x<p.x+p.w) {

            player.y=p.y-player.h;
            player.vy=0;
            player.grounded=true;
            player.jumps=2;
        }
    }

    for(const b of level.blocks) {
        if(player.vy<0 &&
           previousTop>=b.y+b.h-4 &&
           player.y<=b.y+b.h &&
           player.x+player.w>b.x &&
           player.x<b.x+b.w) {

            player.y=b.y+b.h;
            player.vy=40;

            sound(310,.1,430);

            if(!b.hit) {
                b.hit=true;

                level.seeds.push({
                    x:b.x+2,
                    y:b.y-20,
                    collected:false
                });

                burst(b.x+9,b.y,"#ffcf40",8);
            }
        }
    }

    if(player.y>H+30) {
        damage(true);

        if(state!=="PLAY") return;
    }

    // Coleta de sementes.

    for(const s of level.seeds) {
        if(s.collected) continue;

        if(overlap(player,{
            x:s.x,y:s.y,w:16,h:18
        })) {
            s.collected=true;

            level.collected++;
            totalSeeds++;
            score+=100;

            save.totalSeeds++;

            unlock("first");

            if(save.totalSeeds>=50) unlock("fifty");

            saveGame();

            sound(660,.1,990);

            burst(s.x+8,s.y+9,"#a7f3d0",10);
        }
    }

    const kickBox={
        x:player.facing===1?
            player.x+player.w:player.x-26,
        y:player.y+4,
        w:26,h:28
    };

    // Obstáculos e pássaros.

    for(const o of level.obstacles) {
        if(o.removed) continue;

        if(o.type==="bird" || o.type==="roller") {
            o.x+=o.vx*dt;

            if(o.x>o.baseX+95) {
                o.x=o.baseX+95;
                o.vx=-Math.abs(o.vx);

            } else if(o.x<o.baseX-95) {
                o.x=o.baseX-95;
                o.vx=Math.abs(o.vx);
            }
        }

        if(o.type==="bird") {
            o.animation+=dt;

            o.y=o.baseY+
                Math.sin(o.animation*3)*4;

            if(!o.passed && player.x>o.baseX+125) {
                o.passed=true;

                if(!o.collided) {
                    score+=150;
                    burst(player.x,player.y,"#ffcf40",8);
                }
            }
        }

        // Chute somente em obstáculos inanimados.

        if(player.attack>0 &&
           o.type==="roller" &&
           overlap(kickBox,o)) {

            o.removed=true;
            score+=150;

            sound(220,.12,400);

            burst(o.x+12,o.y+12,"#ffcf40",10);

            continue;
        }

        if(overlap(player,o)) {

            if(o.type==="roller" &&
               player.vy>0 &&
               previousBottom<=o.y+10) {

                o.removed=true;
                player.vy=-260;
                score+=150;

            } else {
                if(o.type==="bird") o.collided=true;

                damage();

                if(state!=="PLAY") return;
            }
        }
    }

    // Câmera suave.

    const targetCamera=Math.max(
        0,
        Math.min(level.cfg.length-W,player.x-130)
    );

    camera+=(targetCamera-camera)*Math.min(1,dt*10);

    // Entrega das sementes.

    if(player.x+player.w>=level.npcX-10) {
        finishLevel();
        return;
    }

    for(let i=particles.length-1;i>=0;i--) {
        const p=particles[i];

        p.x+=p.vx*dt;
        p.y+=p.vy*dt;
        p.vy+=320*dt;
        p.life-=dt;

        if(p.life<=0) particles.splice(i,1);
    }
}

// ======================================
// DESENHO DO LOBO
// ======================================

function drawPlayer() {
    if(player.invulnerable>0 &&
       Math.floor(player.invulnerable*16)%2===0) {
        return;
    }

    let frames=WOLF.idle;
    let fps=5;

    if(player.attack>0) {
        frames=WOLF.attack;
        fps=14;

    } else if(!player.grounded) {

        if(player.jumps===0 && player.vy<0) {
            frames=WOLF.doubleJump;

        } else if(player.vy<0) {
            frames=WOLF.jump;

        } else {
            frames=WOLF.fall;
        }

        fps=8;

    } else if(player.crouching) {
        frames=WOLF.crouch;

    } else if(Math.abs(player.vx)>95) {
        frames=WOLF.run;
        fps=12;

    } else if(Math.abs(player.vx)>8) {
        frames=WOLF.walk;
        fps=8;
    }

    const frame=frames[
        Math.floor(player.animation*fps)%frames.length
    ];

    const h=player.crouching?28:46;
    const w=player.attack>0?36:28;

    drawSprite(
        images.wolf,frame,
        player.x-3,
        player.y+player.h-h,
        w,h,
        player.facing<0,
        "#40e0d0"
    );
}

function formatTime(ms) {
    const m=Math.floor(ms/60000);
    const s=Math.floor(ms%60000/1000);
    const mil=Math.floor(ms%1000);

    return String(m).padStart(2,"0")+":"+
           String(s).padStart(2,"0")+":"+
           String(mil).padStart(3,"0");
}

function drawHeart(x,y) {
    ctx.fillStyle="#ff4d6d";

    ctx.fillRect(x+2,y,3,2);
    ctx.fillRect(x+7,y,3,2);
    ctx.fillRect(x,y+2,12,3);
    ctx.fillRect(x+1,y+5,10,3);
    ctx.fillRect(x+2,y+8,8,2);
    ctx.fillRect(x+4,y+10,4,2);
    ctx.fillRect(x+5,y+12,2,1);
}

function drawHUD() {
    ctx.fillStyle="#102219dd";

    ctx.fillRect(5,5,235,23);
    ctx.fillRect(W-130,5,125,23);

    for(let i=0;i<3;i++) {
        if(i<lives) {
            drawHeart(10+i*16,10);
        } else {
            ctx.fillStyle="#42564b";
            ctx.fillRect(10+i*16,12,12,10);
        }
    }

    ctx.font="bold 10px monospace";

    ctx.fillStyle="#a7f3d0";
    ctx.fillText("SEM:"+level.collected,64,20);

    ctx.fillStyle="#ffcf40";
    ctx.fillText("F"+(levelIndex+1),116,20);

    ctx.fillStyle="#ffffff";
    ctx.fillText("PTS:"+score,145,20);

    ctx.fillText(formatTime(elapsed),W-117,20);

    const progress=Math.min(1,player.x/level.npcX);

    ctx.fillStyle="#183327";
    ctx.fillRect(8,32,W-16,4);

    ctx.fillStyle="#74c69d";
    ctx.fillRect(8,32,(W-16)*progress,4);
}

// ======================================
// RENDERIZAÇÃO
// ======================================

function render() {
    ctx.clearRect(0,0,W,H);

    if(!level) {
        ctx.fillStyle="#183327";
        ctx.fillRect(0,0,W,H);
        return;
    }

    const offset=Math.floor(camera*.25%W);

    drawSprite(
        images.cerrado,
        SPRITES[level.cfg.bg],
        -offset,0,W,GROUND,
        false,"#779e78"
    );

    drawSprite(
        images.cerrado,
        SPRITES[level.cfg.bg],
        W-offset,0,W,GROUND,
        false,"#779e78"
    );

    if(levelIndex===2) {
        drawSprite(
            images.cerrado,
            SPRITES.waterfall,
            320-camera*.35%W,
            GROUND-72,
            48,72
        );
    }

    ctx.save();
    ctx.translate(-Math.floor(camera),0);

    // Vegetação e animais decorativos.

    ctx.globalAlpha=.85;

    for(const d of level.decorations) {
        if(d.x+d.w<camera-20 ||
           d.x>camera+W+20) continue;

        drawSprite(
            images.cerrado,
            SPRITES[d.sprite],
            d.x,d.y,d.w,d.h
        );
    }

    ctx.globalAlpha=1;

    // Chão.

    const tile=16;
    const first=Math.floor(camera/tile)*tile;

    for(let x=first;x<camera+W+tile;x+=tile) {

        const pit=level.pits.some(p=>
            x+tile/2>p.x &&
            x+tile/2<p.x+p.w
        );

        if(!pit) {
            drawSprite(
                images.cerrado,
                SPRITES.ground,
                x,GROUND,tile,H-GROUND,
                false,"#805b32"
            );

        } else if(levelIndex===2) {
            ctx.fillStyle="#29b6f6";

            ctx.fillRect(
                x,GROUND+12,tile,H-GROUND
            );
        }
    }

    // Plataformas.

    for(const p of level.platforms) {
        drawSprite(
            images.cerrado,
            SPRITES.platform,
            p.x,p.y,p.w,p.h,
            false,"#8b693d"
        );
    }

    // Blocos.

    for(const b of level.blocks) {
        ctx.fillStyle=b.hit?"#6d594a":"#f4a226";

        ctx.fillRect(b.x,b.y,b.w,b.h);

        ctx.strokeStyle="#302010";
        ctx.strokeRect(b.x,b.y,b.w,b.h);

        if(!b.hit) {
            ctx.fillStyle="#fff8d6";
            ctx.font="bold 13px monospace";
            ctx.fillText("?",b.x+5,b.y+13);
        }
    }

    // Sementes.

    for(const s of level.seeds) {
        if(s.collected) continue;

        const bob=Math.sin(
            elapsed/180+s.x*.03
        )*2.5;

        drawSprite(
            images.seed,
            [.22,.16,.56,.68],
            s.x,s.y+bob,16,18,
            false,"#e2c34e"
        );
    }

    // Obstáculos.

    for(const o of level.obstacles) {
        if(o.removed) continue;

        if(o.x+o.w<camera-40 ||
           o.x>camera+W+40) continue;

        if(o.type==="bird") {
            drawBird(o);
            continue;
        }

        let sprite=o.type;

        if(sprite==="roller") sprite="rock";
        if(sprite==="branch") sprite="bush";

        drawSprite(
            images.cerrado,
            SPRITES[sprite],
            o.x,o.y,o.w,o.h,
            o.vx>0,
            "#9b7850"
        );
    }

    // Engenheira ambiental.

    drawSprite(
        images.npc,
        [.52,.04,.21,.91],
        level.npcX,
        GROUND-58,
        32,58,
        true,"#527fa3"
    );

    ctx.fillStyle="#ffcf40";
    ctx.font="bold 8px monospace";

    ctx.fillText(
        "ENTREGA DE SEMENTES",
        level.npcX-35,
        GROUND-65
    );

    drawPlayer();

    // Partículas.

    for(const p of particles) {
        ctx.fillStyle=p.color;

        ctx.fillRect(
            Math.round(p.x),
            Math.round(p.y),
            3,3
        );
    }

    ctx.restore();

    if(state!=="MENU") drawHUD();
}

// ======================================
// FINALIZAÇÃO DA FASE
// ======================================

function finishLevel() {
    if(state!=="PLAY") return;

    state="END";
    clearKeys();

    const bonus=hits===0?400:0;

    score+=500+bonus;
    delivered+=level.collected;

    if(hits===0) unlock("nohit");

    if(levelIndex===2) unlock("water");

    if(level.seeds.every(s=>s.collected) &&
       level.blocks.every(b=>b.hit)) {
        unlock("hero");
    }

    save.unlocked=Math.max(
        save.unlocked,
        Math.min(LEVELS.length,levelIndex+2)
    );

    save.bestScore=Math.max(save.bestScore,score);

    save.maxSeeds=Math.max(save.maxSeeds,delivered);

    const last=levelIndex===LEVELS.length-1;

    if(last && startIndex===0) {
        unlock("guardian");

        if(save.bestTime===null ||
           elapsed<save.bestTime) {
            save.bestTime=elapsed;
        }
    }

    saveGame();

    hideMenus();
    updateTouch();

    $("endTitle").textContent=last?
        "CERRADO PROTEGIDO!":
        "FASE CONCLUÍDA!";

    $("endContent").innerHTML=`
        <strong>Engenheira Ambiental:</strong>
        <p>${level.cfg.curiosity}</p>
        <hr>
        <p>Sementes entregues: ${level.collected}</p>
        <p>Bônus da fase: +500</p>
        <p>Bônus sem colisões: +${bonus}</p>
        <p>Pontuação: ${score}</p>
        <p>Tempo: ${formatTime(elapsed)}</p>
    `;

    $("next").textContent=last?
        "JOGAR NOVAMENTE":
        "PRÓXIMA FASE";

    $("next").onclick=()=>{
        if(last) startRun(0);
        else startLevel(levelIndex+1);
    };

    $("endMenu").classList.remove("hidden");

    [523,659,784,1046].forEach((f,i)=>{
        setTimeout(()=>sound(f,.15),i*120);
    });
}

function gameOver() {
    state="END";

    clearKeys();

    save.bestScore=Math.max(save.bestScore,score);
    save.maxSeeds=Math.max(save.maxSeeds,delivered);

    saveGame();

    hideMenus();
    updateTouch();

    $("endTitle").textContent="FIM DE JOGO";

    $("endContent").innerHTML=`
        <p>Pontuação: ${score}</p>
        <p>Sementes coletadas: ${totalSeeds}</p>
        <p>Sementes entregues: ${delivered}</p>
        <p>Tempo: ${formatTime(elapsed)}</p>
        <p>Tente novamente para proteger o Cerrado!</p>
    `;

    $("next").textContent="TENTAR NOVAMENTE";

    $("next").onclick=()=>startRun(startIndex);

    $("endMenu").classList.remove("hidden");
}

// ======================================
// MENUS
// ======================================

function hideMenus() {
    document.querySelectorAll(".overlay").forEach(
        m=>m.classList.add("hidden")
    );
}

function updateTouch() {
    $("touch").classList.toggle(
        "hidden",
        mode!=="mobile" || state!=="PLAY"
    );
}

function mainMenu() {
    state="MENU";

    clearKeys();
    hideMenus();
    updateTouch();

    $("menu").classList.remove("hidden");
}

function pause() {
    if(state==="PLAY") {
        state="PAUSE";

        clearKeys();
        hideMenus();

        $("pauseMenu").classList.remove("hidden");

    } else if(state==="PAUSE") {
        state="PLAY";

        hideMenus();
    }

    updateTouch();
}

function submenu(title,content) {
    hideMenus();

    $("subTitle").textContent=title;
    $("subContent").innerHTML=content;

    $("submenu").classList.remove("hidden");
}

$("pc").onclick=()=>{
    mode="pc";
    $("pc").classList.add("active");
    $("mobile").classList.remove("active");
};

$("mobile").onclick=()=>{
    mode="mobile";
    $("mobile").classList.add("active");
    $("pc").classList.remove("active");
};

document.querySelectorAll("[data-diff]").forEach(b=>{
    b.onclick=()=>{
        difficulty=b.dataset.diff;

        document.querySelectorAll("[data-diff]").forEach(
            x=>x.classList.remove("active")
        );

        b.classList.add("active");
    };
});

$("play").onclick=()=>startRun(0);
$("resume").onclick=pause;
$("restart").onclick=()=>startRun(startIndex);
$("quit").onclick=mainMenu;
$("back").onclick=mainMenu;
$("endBack").onclick=mainMenu;

$("levels").onclick=()=>{
    submenu(
        "SELECIONAR FASE",
        LEVELS.map((l,i)=>`
            <p><strong>FASE ${i+1}: ${l.name}</strong></p>
            <p>${l.mission}</p>
            <button data-level="${i}"
                ${i+1>save.unlocked?"disabled":""}>
                ${i+1>save.unlocked?"BLOQUEADA":"JOGAR"}
            </button>
            <hr>
        `).join("")
    );

    document.querySelectorAll("[data-level]").forEach(b=>{
        b.onclick=()=>startRun(Number(b.dataset.level));
    });
};

$("howto").onclick=()=>{
    submenu("COMO JOGAR",`
        <p><strong>A:</strong> Mover para trás.</p>
        <p><strong>D:</strong> Mover para frente.</p>
        <p><strong>W, Espaço ou Backspace:</strong> Pular.</p>
        <p>Pressione novamente para realizar o pulo duplo.</p>
        <p><strong>S:</strong> Agachar.</p>
        <p><strong>J/Z:</strong> Remover obstáculos móveis.</p>
        <p><strong>P:</strong> Pausar.</p>
        <hr>
        <p>Colete sementes nativas.</p>
        <p>Desvie dos animais e obstáculos.</p>
        <p>Entregue as sementes à engenheira ambiental.</p>
        <p>Complete as quatro fases.</p>
    `);
};

$("missions").onclick=()=>{
    submenu(
        "MISSÕES AMBIENTAIS",
        LEVELS.map((l,i)=>`
            <p><strong>${i+1}. ${l.name}</strong></p>
            <p>${l.mission}</p>
            <p>${l.curiosity}</p>
            <hr>
        `).join("")
    );
};

$("records").onclick=()=>{
    submenu("RECORDES",`
        <p>Maior pontuação: ${save.bestScore}</p>
        <p>Melhor tempo:
            ${save.bestTime===null?
                "Ainda não registrado":
                formatTime(save.bestTime)}
        </p>
        <p>Maior entrega: ${save.maxSeeds} sementes</p>
        <p>Total coletado: ${save.totalSeeds} sementes</p>
    `);
};

$("achievements").onclick=()=>{
    submenu(
        "CONQUISTAS",
        ACHIEVEMENTS.map(a=>`
            <p style="color:${
                save.achievements.includes(a[0])?
                "#ffcf40":"#91a69b"
            }">
                <strong>
                    ${save.achievements.includes(a[0])?
                        "🏆":"🔒"}
                    ${a[1]}
                </strong>
            </p>
            <p>${a[2]}</p>
            <hr>
        `).join("")
    );
};

// ======================================
// LOOP PRINCIPAL
// ======================================

let lastTime=performance.now();
let accumulator=0;

const STEP=1/120;

function loop(now) {
    const dt=Math.min(
        (now-lastTime)/1000,
        .1
    );

    lastTime=now;

    if(state==="PLAY") {
        accumulator+=dt;

        while(accumulator>=STEP) {
            update(STEP);

            accumulator-=STEP;

            if(state!=="PLAY") {
                accumulator=0;
                break;
            }
        }

    } else {
        accumulator=0;
    }

    render();

    requestAnimationFrame(loop);
}

// ======================================
// INICIALIZAÇÃO
// ======================================

async function init() {
    $("play").disabled=true;
    $("play").textContent="CARREGANDO...";

    await loadAssets();

    level=buildLevel(0);

    $("play").disabled=false;
    $("play").textContent="JOGAR";

    mainMenu();

    lastTime=performance.now();

    requestAnimationFrame(loop);
}

init();

})();
</script>
